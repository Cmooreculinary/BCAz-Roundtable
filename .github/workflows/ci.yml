name: Launch Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
        continue-on-error: true
      - name: Format check (black)
        run: black --check .
        continue-on-error: true
      - name: Reject Python syntax and undefined-name errors
        run: ruff check . --select E9,F63,F7,F82
      - name: Audit backend runtime dependencies
        run: pip-audit -r requirements.txt
      - name: Run isolated HTTPS launch gate
        run: python check_launch.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      REACT_APP_BACKEND_URL: roundtable-vo-backend.onrender.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --include=dev
      - name: Audit frontend runtime dependencies
        run: npm audit --omit=dev --audit-level=low
      - name: Lint (ESLint)
        run: npm run lint
      - name: Run frontend tests
        run: |
          set -o pipefail
          npm test -- --watchAll=false --runInBand 2>&1 | tee /tmp/roundtable-frontend-tests.log
        env:
          CI: "true"
      - name: Upload frontend test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-test-diagnostics
          path: /tmp/roundtable-frontend-tests.log
          if-no-files-found: error
          retention-days: 3
      - run: npm run build
